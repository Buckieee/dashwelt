<script>
/* spin the globe about its own axis: parallels stay put, meridians roll round */
(function(){
  const el=document.getElementById('mer'); if(!el) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cx=630,cy=508,R=357,roll=34*Math.PI/180,pitch=14*Math.PI/180,STEP=20*Math.PI/180,BASE=7*Math.PI/180;
  const cr=Math.cos(roll),sr=Math.sin(roll),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const N=90, lats=[]; for(let i=0;i<=N;i++){ const a=-Math.PI/2+i*Math.PI/N; lats.push([Math.cos(a),Math.sin(a)]); }
  const PERIOD=7000;                       // one meridian-width of turn every 7s; the grid repeats, so it loops seamlessly
  function draw(t){
    const spin=(t%PERIOD)/PERIOD*STEP; let d='';
    for(let k=0;k<18;k++){
      const lon=BASE+k*STEP+spin, sl=Math.sin(lon), cl=Math.cos(lon); let pen=false;
      for(const [ca,sa] of lats){
        const X=ca*sl, Y=sa, Z=ca*cl, Y2=Y*cp-Z*sp, Z2=Y*sp+Z*cp;
        if(Z2<0){ pen=false; continue; }
        const x=cx+(X*cr-Y2*sr)*R, y=cy-(X*sr+Y2*cr)*R;
        d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); pen=true;
      }
    }
    el.setAttribute('d',d);
  }
  function loop(t){ if(!document.hidden) draw(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
